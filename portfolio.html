    <style>
        .grid {
            padding: 20px 20px 100px 20px;
            max-width: 1300px;
            margin: 0 auto;
            list-style: none;
            text-align: center;
        }

            .grid li {
                display: inline-block;
                width: 500px;
                margin: 0;
                padding: 20px;
                text-align: left;
                position: relative;
            }

            .grid figure {
                margin: 0;
                position: relative;
                overflow: hidden;
            }

                .grid figure img {
                    display: inline-block;
                    position: relative;
                    transition: transform 0.4s;
                    height: 500px;
                    width: 500px;
                }

            .grid figcaption {
                position: absolute;
                top: 0;
                left: 0;
                padding: 20px;
                background: #2c3f52;
                color: #ed4e6e;
                height: 50%;
                width: 100%;
                top: auto;
                bottom: 0;
                opacity: 0;
                transform: translateY(100%);
                transition: transform 0.4s, opacity 0.1s 0.3s;
            }

                .grid figcaption h3 {
                    margin: 0;
                    padding: 0;
                    color: #fff;
                }

                .grid figcaption a {
                    text-align: center;
                    padding: 5px 10px;
                    border-radius: 2px;
                    display: inline-block;
                    background: #ed4e6e;
                    color: #fff;
                    position: absolute;
                    bottom: 20px;
                    right: 20px;
                }

            .grid figure:hover img {
                transform: translateY(10%);
                transform: scale(1.2);
            }


            .grid figure:hover figcaption {
                opacity: 1;
                transform: translateY(0px);
                transition: transform 0.4s, opacity 0.1s;
            }
    </style>


    <ul class="grid">
        <li>
            <figure>
                <img src="mod1.JPG" class="image" />
                <figcaption>
                    <p>
                        During my first year design class, my team and I developed a prototype for a system that detects humidity, temperature, and soil moisture levels that targeted exotic ecosystems. For the actual prototype, a custom PCB was designed with CAD as well
                        as an external casing that was 3D printed. The website was developped using Bootstrap, HTML, and JS and done with a backend of PHP. The backend dealt with the login and data flow from the module that was displayed on the site.
                    </p>
                </figcaption>
            </figure>
        </li>
        <li>
            <figure>
                <img src="child_detector.jpg" class="image" />
                <figcaption>
                    <p>
                        Child detector made in my second year design class using FSR, temperature, and PIR sensors, and Arduino UNO to detect temperature and the variables that corresponded to a presence of a child (weight and movement).
                        This was programmed with Arduino C and assembled over a course of a few weeks. The data is continously streamed into the server, and if there is a trigger for any "dangerous" conditions, then it will ring the buzzer.
                    </p>
                </figcaption>
            </figure>
        </li>
        <li>
            <figure>
                <img src="assets/game1.gif" class="image" />
                <figcaption>
                    <p>
                        This game was my first taste of programming through the OOP language used in Adobe Flash of Actionscript 3.  The game took a course of over two months by myself. This was a racing game where you aimed to finish three laps at the fastest time possible in four different tracks.  I developped and animated all the content of the game through Adobe Flash CS4 and used publically sourced images and music for the game's assets. 
                    </p>
                </figcaption>
            </figure>
        </li>

    </ul>
